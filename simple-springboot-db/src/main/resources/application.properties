# --- Base de datos (sobrescribible por variables de entorno) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/conciliadb?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- JWT: JWT_SECRET es OBLIGATORIO (mínimo 32 caracteres). Sin él la app no arranca. ---
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:28800000}

# --- CORS (lista separada por comas) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Admin inicial (opcional; se crea solo si ambos están definidos y el correo no existe) ---
app.admin.correo=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.nombre=${ADMIN_NOMBRE:Administrador}
app.admin.apellido=${ADMIN_APELLIDO:ConciliaYa}
